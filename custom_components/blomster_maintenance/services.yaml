set_water_baseline:
  name: Ange vattenbaslinje
  description: Sätter korrekt ackumulerad vattenförbrukning och sparar dagens aktuella källvärde.
  fields:
    baseline_liters:
      name: Baslinje
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: L
          mode: box

configure_item:
  name: Skapa eller uppdatera serviceobjekt
  description: Skapar ett underhållsobjekt och sparar metadata, dokumentlänkar samt serviceintervall.
  fields:
    item_id:
      name: ID
      required: true
      selector: {text: {}}
    name:
      name: Namn
      required: true
      selector: {text: {}}
    category:
      name: Kategori
      selector: {text: {}}
    location:
      name: Placering
      selector: {text: {}}
    manufacturer:
      name: Tillverkare
      selector: {text: {}}
    model:
      name: Modell
      selector: {text: {}}
    serial_number:
      name: Serienummer
      selector: {text: {}}
    installed_at:
      name: Installationsdatum
      selector: {date: {}}
    interval_type:
      name: Intervalltyp
      selector:
        select:
          options:
            - {value: days, label: Dagar}
            - {value: liters, label: Liter}
            - {value: hours, label: Timmar}
            - {value: starts, label: Antal starter}
    interval_value:
      name: Intervall
      selector:
        number: {min: 0, step: 0.1, mode: box}
    meter_entity:
      name: Mätarentitet
      selector:
        entity: {domain: sensor}
    manual_url:
      name: Manual
      description: Lokal eller extern URL.
      selector: {text: {}}
    receipt_url:
      name: Kvitto
      description: Lokal eller extern URL.
      selector: {text: {}}
    image_url:
      name: Bild
      description: Lokal eller extern URL.
      selector: {text: {}}
    warning_entities:
      name: Externa varningsentiteter
      description: En eller flera entiteter som också ska aktivera objektets problemvarning.
      selector:
        entity:
          multiple: true

record_maintenance:
  name: Registrera underhåll
  description: Sparar en underhållshändelse med mätarställning, anteckning och kostnad.
  fields:
    item_id:
      name: ID
      required: true
      selector: {text: {}}
    name:
      name: Namn
      required: true
      selector: {text: {}}
    meter_entity:
      name: Mätarentitet
      description: Om fältet lämnas tomt används objektets konfigurerade mätarentitet.
      selector:
        entity: {domain: sensor}
    cost:
      name: Kostnad
      selector:
        number: {min: 0, step: 0.01, unit_of_measurement: kr, mode: box}
    note:
      name: Anteckning
      selector:
        text: {multiline: true}

delete_maintenance:
  name: Ta bort underhållspost
  description: Tar bort exakt en händelse med objektets ID och händelsens unika ID.
  fields:
    item_id:
      name: Underhålls-ID
      required: true
      selector: {text: {}}

import_water_history:
  name: Importera vattenhistorik
  description: Bygger vattenbaslinjen från Recorder endast om historiken täcker hela perioden från installationsdatum till nutid.

acknowledge_maintenance:
  name: Kvittera underhållsvarning
  description: Kvitterar objektets nuvarande varningsorsaker. En ny eller förändrad orsak aktiverar varningen igen.
  fields:
    item_id:
      name: Underhålls-ID
      required: true
      selector: {text: {}}
    event_id:
      name: Händelse-ID
      required: true
      selector: {text: {}}

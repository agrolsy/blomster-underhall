set_water_baseline:
  name: Ange vattenbaslinje
  description: Sätter den korrekta ackumulerade vattenförbrukningen och sparar samtidigt dagens aktuella Grohe-värde för att undvika dubbelräkning.
  fields:
    baseline_liters:
      name: Baslinje
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: L
          mode: box

record_maintenance:
  name: Registrera underhåll
  description: Sparar en underhållshändelse med aktuell ackumulerad vattenförbrukning.
  fields:
    item_id:
      name: ID
      required: true
      selector:
        text:
    name:
      name: Namn
      required: true
      selector:
        text:
    note:
      name: Anteckning
      required: false
      selector:
        text:
          multiline: true

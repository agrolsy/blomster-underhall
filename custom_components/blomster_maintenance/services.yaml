set_water_baseline:
  name: Ange vattenbaslinje
  description: Sätter den korrekta ackumulerade vattenförbrukningen och sparar samtidigt dagens aktuella Grohe-värde för att undvika dubbelräkning.
  fields:
    baseline_liters:
      name: Baslinje
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: L
          mode: box

record_maintenance:
  name: Registrera underhåll
  description: Sparar en underhållshändelse och kan samtidigt läsa av en relevant mätarentitet, exempelvis Luba-timmar eller vattenförbrukning.
  fields:
    item_id:
      name: ID
      required: true
      selector:
        text:
    name:
      name: Namn
      required: true
      selector:
        text:
    meter_entity:
      name: Mätarentitet
      description: Valfri sensor vars aktuella värde och enhet ska sparas med underhållshändelsen.
      required: false
      selector:
        entity:
          domain: sensor
    note:
      name: Anteckning
      required: false
      selector:
        text:
          multiline: true

delete_maintenance:
  name: Ta bort underhållspost
  description: Tar bort exakt en registrerad underhållshändelse med hjälp av objektets ID och händelsens unika ID.
  fields:
    item_id:
      name: Underhålls-ID
      required: true
      selector:
        text:
    event_id:
      name: Händelse-ID
      required: true
      selector:
        text:

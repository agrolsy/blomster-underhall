name: Säkerhetsskanning

on:
  schedule:
    - cron: '17 2 4 * *'  # den 4:e varje månad 02:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-audit.yml'
      - '.gitleaks.toml'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret-scan (gitleaks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, blomster-underhall-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hämta gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Kör gitleaks på hela historiken
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner'
